# Tight self-collision proxy model generated from the local-frame STL geometry.
# Body and distal-arm proxies keep about 2 mm margin. The head sphere and
# upper-torso box jointly cover the neck through the full head-pitch range.
# The PD04-EG box covers
# its complete finger stroke; the mobile thigh uses a Y-rotated oriented box
# fitted to the diagonal knee-link mesh with about 5 mm margin per side.
# Proximal arm links, chassis, wheels, environment and within-arm adjacent
# pairs are intentionally omitted. Distances and dimensions are in metres.
